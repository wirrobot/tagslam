# ═══════════════════════════════════════════════════════════════
# 两 AprilTag 配置：贴在水平墙上，上下排列（A4 纸竖向）
#
# 坐标系定义（World / Body 原点 = 大 Tag ID=0 的中心）：
#   x 轴 — 垂直于墙面，指向摄像头方向（从墙向摄像头为正）
#   y 轴 — 沿墙面水平方向，面向墙时向右为正
#   z 轴 — 竖直向上
#
# Tag 布局（面向墙的视角）：
#        ┌───────────────────┐
#        │  Tag 0 (大)       │  ID=0  128.3mm  原点 (0,0,0)
#        │  z = 0            │
#        └───────────────────┘
#               ↕ gap 64.16mm
#        ┌─────────────┐
#        │  Tag 1 (小)  │        ID=1  64.16mm  z = -0.160m
#        │  z = -0.160  │
#        └─────────────┘
#
# 旋转说明：rotation 使用轴角(Axis-Angle)表示法
#   {x:0, y:1.5708, z:0} = 绕 y 轴旋转 90°(π/2)
#   使 Tag 法线（Tag 局部 z）对齐到 World x（垂直于墙面向外）
# ═══════════════════════════════════════════════════════════════

tagslam_parameters:
  optimizer_mode: slow
  minimum_viewing_angle: 15.0
  minimum_tag_area: 200
  max_num_incremental_opt: 50
  pixel_noise: 1.0
  max_subgraph_error: 500.0
  ambiguity_angle_threshold: 40.0
  max_ambiguity_ratio: 0.5
  subgraph_abs_prior_position_noise: 0.1
  subgraph_abs_prior_rotation_noise: 0.1
  use_approximate_sync: false

body_defaults:
  position_noise: 0.05
  rotation_noise: 0.01

default_body: tag_map

bodies:
  - tag_map:
      is_static: true
      default_tag_size: 0.1283
      type: simple
      pose:
        position:
          x: 0
          y: 0
          z: 0
        rotation:
          x: 0
          y: 0
          z: 0
        position_noise:
          x: 0.0001
          y: 0.0001
          z: 0.0001
        rotation_noise:
          x: 1.0e-05
          y: 1.0e-05
          z: 1.0e-05
      tags:
        # ── Tag 0：大 tag，128.3mm，原点 ──
        - id: 0
          size: 0.1283
          bits: 6
          pose:
            position:
              x: 0.0
              y: 0.0
              z: 0.0
            rotation:
              x: 0
              y: 1.5708
              z: 0
            position_noise:
              x: 0.0001
              y: 0.0001
              z: 0.0001
            rotation_noise:
              x: 1.0e-05
              y: 1.0e-05
              z: 1.0e-05

        # ── Tag 1：小 tag，64.16mm，正下方 ──
        - id: 1
          size: 0.06416
          bits: 6
          pose:
            position:
              x: 0.0
              y: 0.0
              z: -0.16041              # 下方 160mm (大tag半高 + gap + 小tag半高)
            rotation:
              x: 0
              y: 1.5708
              z: 0
            position_noise:
              x: 0.01                # 弱先验，允许 SLAM 自动微调
              y: 0.01
              z: 0.01
            rotation_noise:
              x: 0.001
              y: 0.001
              z: 0.001

  - rig:
      is_static: false
      type: simple
      odom_frame_id: body_rig
