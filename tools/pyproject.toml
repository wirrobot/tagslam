[project]
name = "tagslam-tools"
version = "0.1.0"
description = "TagSLAM auxiliary tools — camera capture, calibration, visualization"
authors = [
    { name = "waliwuao", email = "1276672206@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5",
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.0",
    "numpy>=1.26,<2.0",
    "pillow>=12.2.0",
    "apriltag>=0.0.16",
    "pyyaml>=6.0",
]

[project.scripts]
tagslam-tools = "tagslam_tools.cli:app"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
